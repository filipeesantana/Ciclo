name: Qualidade do Ciclo
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run check
      - run: npm run audit:inventory
      - name: Testes funcionais
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          npm test 2>&1 | tee test-results/tests.txt
      - run: npm run audit:flashcards
      - run: npm run audit:browser
      - run: npm run audit:field
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verificacao-${{ matrix.browser }}
          path: |
            test-results/
            audit/reviews-flashcards/
          if-no-files-found: ignore
